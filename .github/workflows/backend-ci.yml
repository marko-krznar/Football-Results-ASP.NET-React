name: Backend CI

on:
    pull_request:
        branches: [main]
    push:
        branches: [main]

jobs:
    build-and-test:
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v4

            - uses: actions/setup-dotnet@v4
              with:
                  dotnet-version: "10.0.x"

            - name: Restore dependencies
              run: dotnet restore React-Football-Results.sln

            - name: Build
              run: dotnet build React-Football-Results.sln --no-restore --configuration Release

            - name: Test
              run: dotnet test React-Football-Results.sln --no-build --configuration Release --verbosity normal
